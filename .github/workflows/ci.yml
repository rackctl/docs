name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Read @shuttering/error-pages (and its @shuttering/tokens dep) from GitHub
  # Packages (see .npmrc). A PAT with read:packages on the shuttering org,
  # stored as an org Actions secret. @shuttering/starlight still comes from
  # npmjs (pinned in pnpm.overrides), so npmjs stays the default registry.
  NODE_AUTH_TOKEN: ${{ secrets.SHUTTERING_NPM_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Supply-chain gate. osv-scanner checks the committed pnpm-lock.yaml against
      # the OSV database and exits non-zero on a known vulnerability: an
      # endpoint-independent, maintained hard gate. Pinned to an exact version.
      - name: audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

      # Lint / format gate. Biome checks and formats the source in one pass, exiting
      # non-zero on any lint violation or unformatted file.
      #
      # It is a devDependency rather than an `npx --yes` fetch. The npx form was chosen to
      # avoid touching the lockfile while .npmrc pointed at a private registry — but that
      # registry is scoped to @shuttering, and biome comes from npmjs, so there was nothing
      # to avoid. Two things follow from moving it in: the version is enforced by the
      # lockfile rather than by a string in a script, and osv-scanner covers it, which it
      # cannot do for a package that is downloaded after the scan has already run.
      #
      # Ahead of the type check and build because it is the fastest gate here by two orders
      # of magnitude, and failing in 11ms beats failing after a full Astro build.
      - name: lint (biome)
        run: pnpm run lint

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build
