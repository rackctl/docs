name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Every @shuttering/* package — starlight, error-pages and its tokens dep —
      # comes from GitHub Packages (see .npmrc), so this token gates the whole
      # install, not a peripheral part of it. A PAT with read:packages on the
      # shuttering org, stored as an org Actions secret.
      #
      # Set here rather than as a NODE_AUTH_TOKEN env var expanded by .npmrc,
      # because pnpm stopped expanding environment variables in registry
      # credentials that come from a PROJECT .npmrc in 10.34.2 — that file is
      # committed, so a malicious edit could forward the secret to an
      # attacker-controlled registry. It now warns and IGNORES the line. The
      # repo pins pnpm@10.32.1, so the old form still works today and would
      # have gone on working until some routine bump crossed 10.34.2 and the
      # install started resolving @shuttering/* unauthenticated against npmjs,
      # where they do not exist. `pnpm config set` writes to a trusted
      # user-level config that pnpm still honours, and is what pnpm's own
      # warning recommends. Matches rackctl/web.
      - name: Configure @shuttering registry auth
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$SHUTTERING_NPM_TOKEN"
        env:
          SHUTTERING_NPM_TOKEN: ${{ secrets.SHUTTERING_NPM_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # Supply-chain gate. osv-scanner checks the committed pnpm-lock.yaml against
      # the OSV database and exits non-zero on a known vulnerability: an
      # endpoint-independent, maintained hard gate. Pinned to an exact version.
      - name: audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

      # Lint / format gate. Biome checks and formats the source in one pass, exiting
      # non-zero on any lint violation or unformatted file.
      #
      # It is a devDependency rather than an `npx --yes` fetch. The npx form was chosen to
      # avoid touching the lockfile while .npmrc pointed at a private registry — but that
      # registry is scoped to @shuttering, and biome comes from npmjs, so there was nothing
      # to avoid. Two things follow from moving it in: the version is enforced by the
      # lockfile rather than by a string in a script, and osv-scanner covers it, which it
      # cannot do for a package that is downloaded after the scan has already run.
      #
      # Ahead of the type check and build because it is the fastest gate here by two orders
      # of magnitude, and failing in 11ms beats failing after a full Astro build.
      - name: lint (biome)
        run: pnpm run lint

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      # Page transitions. Loads every routed page from dist/ in headless Chrome and
      # asserts each view-transition-name resolves to exactly one element — a second
      # claimant aborts the whole transition, and no other gate here notices.
      #
      # A separate step rather than part of `postbuild`, because it drives Chrome and
      # this repo deliberately keeps Chrome out of the build: og-image.mjs states that
      # rule and commits its artifact to honour it. Do not fold this into postbuild —
      # a local `pnpm build` would then launch a browser.
      #
      # No browser setup action: the ubuntu runner images ship Google Chrome and export
      # CHROME_BIN pointing at /usr/bin/google-chrome, which the script honours. The
      # script fails rather than skips if no browser is found, so a runner that stopped
      # shipping one would surface here instead of silently reporting coverage.
      - name: Page transitions
        run: pnpm run check:transitions
