name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Dormant until infra is applied and the deploy role ARN is set as a variable.
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # See ci.yml for why this is `pnpm config set` and not a NODE_AUTH_TOKEN
      # env var: pnpm ignores env expansion in a committed project .npmrc from
      # 10.34.2 onward, so the env-var form is a silent failure waiting on a
      # routine pnpm bump.
      - name: Configure @shuttering registry auth
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$SHUTTERING_NPM_TOKEN"
        env:
          SHUTTERING_NPM_TOKEN: ${{ secrets.SHUTTERING_NPM_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync and invalidate
        env:
          BUCKET: rackctl-docs-site-477165397189
          DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: |
          aws s3 sync dist/ "s3://$BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
