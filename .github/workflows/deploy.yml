name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # id-token: write lets configure-aws-credentials exchange the job's OIDC token for
    # the deploy role. It is granted here rather than at the workflow level so that a
    # job added to this file later does not inherit it.
    permissions:
      contents: read
      id-token: write # OIDC exchange for the deploy role
    steps:
      # A missing variable used to make this job `if:`-skip, which GitHub reports as
      # a GREEN run — main would merge and publish nothing, with no signal anywhere.
      # Deploy config is required, so assert it and fail loudly instead.
      - name: Require deploy configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          BUCKET: ${{ vars.DOCS_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: |
          missing=()
          [ -n "$ROLE_ARN" ]        || missing+=(AWS_DEPLOY_ROLE_ARN)
          [ -n "$BUCKET" ]          || missing+=(DOCS_BUCKET)
          [ -n "$DISTRIBUTION_ID" ] || missing+=(DOCS_DISTRIBUTION_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository/org variable(s): ${missing[*]}"
            exit 1
          fi

      # persist-credentials: false keeps the job token out of .git/config, where every
      # later step could read it. Nothing here pushes to or fetches this repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # See ci.yml for why this is `pnpm config set` and not a NODE_AUTH_TOKEN
      # env var: pnpm ignores env expansion in a committed project .npmrc from
      # 10.34.2 onward, so the env-var form is a silent failure waiting on a
      # routine pnpm bump.
      - name: Configure @shuttering registry auth
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$SHUTTERING_NPM_TOKEN"
        env:
          SHUTTERING_NPM_TOKEN: ${{ secrets.SHUTTERING_NPM_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Both the bucket and the distribution come from variables. They used to be
      # bound two different ways on adjacent lines — one hardcoded, one injected —
      # which meant moving accounts required editing the workflow for one of them
      # and only the settings page for the other.
      - name: Sync and invalidate
        env:
          BUCKET: ${{ vars.DOCS_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: |
          aws s3 sync dist/ "s3://$BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'

      # The steps above can all succeed while the site serves nothing useful — a
      # wrong bucket syncs happily into an origin no distribution reads. Assert the
      # real origin actually serves the real page. Retries cover invalidation lag.
      - name: Smoke check
        env:
          SITE: https://docs.rackctl.sh
        run: |
          for path in / /install/ /robots.txt /llms.txt /sitemap.xml /og.png; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 4 \
                        --retry-all-errors --max-time 30 "$SITE$path")
            if [ "$code" != "200" ]; then
              echo "::error::$SITE$path returned $code, expected 200"
              exit 1
            fi
            echo "  ok  $path"
          done
